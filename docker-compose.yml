services:
  app:
    build: .
    env_file:
      - path: .env
        required: false

  # Streamlit-чат врача (демо). Запуск: docker compose up ui → http://localhost:8501
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8080"
    env_file:
      - path: .env
        required: false
